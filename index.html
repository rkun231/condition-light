<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>컨디션 신호등</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="컨디션 신호등">
<meta name="theme-color" content="#0f6e56">
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#1b1d1c;--mut:#5f6461;--line:#dfe2df;--acc:#0f6e56;--accInk:#fff;
--g:#1e9e5a;--y:#d99a00;--r:#d63c2f;--gS:#e3f5ea;--yS:#fff4d6;--rS:#fde5e2;--chip:#eef1ee}
@media (prefers-color-scheme:dark){:root{--bg:#121413;--card:#1c1f1d;--ink:#eceeed;--mut:#a3a9a5;--line:#2f3431;--acc:#4fd1a5;--accInk:#0c1a15;
--g:#4ccf86;--y:#f2bf3a;--r:#ff6b5e;--gS:#173226;--yS:#3a3014;--rS:#3d1d1a;--chip:#262a28}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:19px;margin:22px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:0 0 12px}
.mut{color:var(--mut);font-size:14px}
label.f{display:block;font-weight:600;margin:14px 0 6px}
input[type=number],input[type=text],select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:10px 14px;font:inherit;font-size:16px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:700}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{padding:12px 0;border-radius:12px;border:1px solid var(--line);background:var(--chip);color:var(--ink);font:inherit;font-weight:700}
.scale button.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
.ends{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);margin-top:4px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--acc);color:var(--accInk);font:inherit;font-weight:700;font-size:18px;cursor:pointer;margin-top:16px}
.btn.ghost{background:transparent;color:var(--acc);border:1.5px solid var(--acc)}
.btn.danger{background:transparent;color:var(--r);border:1.5px solid var(--r)}
.btn:disabled{opacity:.4}
.light{display:flex;gap:14px;align-items:center}
.dot{flex:none;width:64px;height:64px;border-radius:50%}
.dot.g{background:var(--g)}.dot.y{background:var(--y)}.dot.r{background:var(--r)}.dot.n{background:var(--line)}
.sig.g{background:var(--gS)}.sig.y{background:var(--yS)}.sig.r{background:var(--rS)}
.big{font-size:22px;font-weight:800;margin:0}
ul.why{margin:10px 0 0;padding-left:20px}ul.why li{margin:4px 0}
.banner{border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.banner.warn{background:var(--yS)}.banner.bad{background:var(--rS)}.banner.info{background:var(--chip)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mut);font:inherit;font-size:13px;padding:10px 0 12px}
nav button b{display:block;font-size:20px;line-height:1.2}
nav button.on{color:var(--acc);font-weight:700}
.hist{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hd{width:14px;height:14px;border-radius:50%;flex:none}
.steps{display:flex;gap:4px;margin:0 0 14px}.steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps i.on{background:var(--acc)}
.yn{display:flex;gap:8px;margin:6px 0 12px}.yn .chip{flex:1;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal .card{width:100%;max-width:560px;border-radius:20px 20px 0 0;margin:0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
small.src{display:block;color:var(--mut);font-size:13px;margin-top:6px}
svg.spark{width:100%;height:60px;display:block}
.vl{list-style:none;padding:0;margin:10px 0 0}.vl li{display:flex;gap:8px;margin:6px 0;font-size:15px}
.vi{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.vi.g{background:var(--g)}.vi.y{background:var(--y)}.vi.r{background:var(--r)}
.mbar{margin-top:10px}.mlab{display:flex;justify-content:space-between;font-size:14px}.track{height:8px;border-radius:8px;background:var(--chip);overflow:hidden}.track i{display:block;height:100%;border-radius:8px}
.fi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.x{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--chip);color:var(--mut);font-size:15px}
.btn.sm{padding:10px;font-size:16px;margin-top:10px}
.sheet{max-height:88vh;overflow-y:auto}
.fl{max-height:42vh;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.fr{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-size:16px;padding:12px}
.fr:last-child{border-bottom:0}.fr .mut{flex:none}
.tag2{font-style:normal;font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:999px;padding:0 6px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip:disabled{opacity:.4}
input[type=date],input[type=search]{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" hidden></nav>
<div id="modal"></div>
<script>
"use strict";
/* ───────── 저장: 이 폰 안(localStorage)에만 ───────── */
const KEY = "condition-note-v1";
const blank = () => ({ profile: null, logs: {}, lastBackup: null, created: today() });
let S = load();
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || blank(); }catch(e){ return blank(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("저장 공간에 쓰지 못했어요. 백업을 먼저 해 주세요."); } }

/* ───────── 날짜·나이 ───────── */
function today(d=new Date()){ const z=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate()); }
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return today(d); }
function ageOf(p){ const n=new Date(); let a=n.getFullYear()-p.birthYear; if(n.getMonth()+1 < p.birthMonth) a--; return a; }
function band(p){ const a=ageOf(p);
  if(a<14) return {id:"u14",name:"유소년 (만 14세 미만)",youth:true};
  if(a<19) return {id:"youth",name:"유소년",youth:true};
  if(a<35) return {id:"adult",name:"성인",youth:false};
  if(a<50) return {id:"masters",name:"성인 · 마스터즈 (35~49세)",youth:false};
  return {id:"m50",name:"성인 · 50세 이상",youth:false}; }

/* ───────── 종목 ───────── */
const SPORTS = {
  "구기": { subs:{ "축구":["골키퍼","수비수","미드필더","공격수"], "풋살":["골레이로","픽소","알라","피보"], "기타 구기":null }, extra:"포지션" },
  "육상": { subs:{ "단거리":null,"중장거리":null,"도약":null,"투척":null,"기타 육상":null } },
  "투기": { subs:{ "복싱":null,"MMA":null,"주짓수":null,"레슬링":null,"태권도":null,"유도":null,"기타 투기":null }, weightClass:true },
  "기타": { subs:{ "기타":null } }
};
const LEVELS = { hobby:"취미 (대회 안 나감)", amateur:"아마추어 대회 출전", pro:"프로·선수 등록" };

/* ───────── 화면 전환 ───────── */
let tab = "today", ob = null;
function go(t){ tab=t; render(); window.scrollTo(0,0); }
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
  if(!S.profile){ $("#nav").hidden=true; return renderOnboard(); }
  $("#nav").hidden=false; renderNav();
  ({today:renderToday, history:renderHistory, food:renderFood, video:renderSoon, settings:renderSettings})[tab]();
}
function renderNav(){
  const T=[["today","●","오늘"],["history","▤","기록"],["food","🍚","식단"],["video","▶","영상"],["settings","⚙","설정"]];
  $("#nav").innerHTML=T.map(([k,i,n])=>`<button class="${tab===k?"on":""}" data-go="${k}"><b>${i}</b>${n}</button>`).join("");
}
document.addEventListener("click", e=>{ const b=e.target.closest("[data-go]"); if(b) go(b.dataset.go); });

/* ───────── 처음 설정 ───────── */
function renderOnboard(){
  ob = ob || { step:0, p:{ birthYear:"", birthMonth:"", sex:"", height:"", weight:"", weeklySessions:"", level:"", cat:"", sub:"", pos:"", weightClass:"", classLimit:"", screening:{} } };
  const p=ob.p, N=6, st=ob.step;
  const bar=`<div class="steps">${Array.from({length:N},(_,i)=>`<i class="${i<=st?"on":""}"></i>`).join("")}</div>`;
  const years=[]; const y=new Date().getFullYear(); for(let i=y-6;i>=y-90;i--) years.push(i);
  let h="", ok=false;
  if(st===0){
    h=`<h1>처음 설정</h1><p class="mut">나이와 성별로 맞는 기준을 골라요. 이 정보는 이 휴대폰 밖으로 나가지 않아요.</p>
    <label class="f">태어난 해와 달</label>
    <div class="row"><select id="by"><option value="">년</option>${years.map(v=>`<option ${+p.birthYear===v?"selected":""}>${v}</option>`).join("")}</select>
    <select id="bm"><option value="">월</option>${Array.from({length:12},(_,i)=>`<option ${+p.birthMonth===i+1?"selected":""}>${i+1}</option>`).join("")}</select></div>
    <label class="f">성별</label><div class="chips">${["남성","여성"].map(v=>`<button class="chip ${p.sex===v?"on":""}" data-sex="${v}">${v}</button>`).join("")}</div>`;
    ok=p.birthYear&&p.birthMonth&&p.sex;
  } else if(st===1){
    h=`<h1>몸과 훈련</h1>
    <div class="row"><div><label class="f">키 (cm)</label><input id="ht" type="number" inputmode="decimal" value="${esc(p.height)}" placeholder="175"></div>
    <div><label class="f">몸무게 (kg)</label><input id="wt" type="number" inputmode="decimal" value="${esc(p.weight)}" placeholder="70"></div></div>
    <label class="f">평소 일주일에 몇 번 훈련하나요?</label>
    <div class="chips">${["0~1","2~3","4~5","6 이상"].map(v=>`<button class="chip ${p.weeklySessions===v?"on":""}" data-ws="${v}">${v}회</button>`).join("")}</div>`;
    ok=+p.height>80&&+p.height<250&&+p.weight>20&&+p.weight<250&&p.weeklySessions;
  } else if(st===2){
    h=`<h1>대회나 경기에 나가나요?</h1><p class="mut">대회 일정이 있으면 경기 날짜에 맞춰 조절해요.</p>
    <div class="chips" style="flex-direction:column">${Object.entries(LEVELS).map(([k,v])=>`<button class="chip ${p.level===k?"on":""}" data-lv="${k}">${v}</button>`).join("")}</div>`;
    ok=!!p.level;
  } else if(st===3){
    h=`<h1>종목</h1><div class="chips">${Object.keys(SPORTS).map(v=>`<button class="chip ${p.cat===v?"on":""}" data-cat="${v}">${v}</button>`).join("")}</div>
    ${p.cat?`<label class="f">세부 종목</label><div class="chips">${Object.keys(SPORTS[p.cat].subs).map(v=>`<button class="chip ${p.sub===v?"on":""}" data-sub="${v}">${v}</button>`).join("")}</div>`:""}
    ${p.sub&&/기타/.test(p.sub)?`<label class="f">종목 이름</label><input id="subname" type="text" value="${esc(p.subName||"")}" placeholder="예: 농구, 수영">`:""}
    ${p.sub&&SPORTS[p.cat].subs[p.sub]?`<label class="f">포지션</label><div class="chips">${SPORTS[p.cat].subs[p.sub].map(v=>`<button class="chip ${p.pos===v?"on":""}" data-pos="${v}">${v}</button>`).join("")}</div>`:""}
    ${p.sub&&SPORTS[p.cat].weightClass?`<div class="row"><div><label class="f">체급 이름 (선택)</label><input id="wc" type="text" value="${esc(p.weightClass)}" placeholder="예: 라이트급"></div>
    <div><label class="f">체급 한계 kg (선택)</label><input id="wl" type="number" inputmode="decimal" value="${esc(p.classLimit)}" placeholder="70.3"></div></div>`:""}`;
    ok=p.cat&&p.sub&&(!SPORTS[p.cat].subs[p.sub]||p.pos);
  } else if(st===4){
    const Q=[["heart","의사에게 심장 질환이나 고혈압 진단을 받은 적이 있나요?"],["chest","운동하거나 쉴 때 가슴 통증·답답함을 느낀 적이 있나요?"],["faint","어지러워서 균형을 잃거나 정신을 잃은 적이 있나요?"]];
    h=`<h1>운동 전 건강 확인</h1><p class="mut">하나라도 '예'면 고강도 운동 전에 진료를 받아 보라고 안내해요. 진단이 아니에요.</p>
    ${Q.map(([k,q])=>`<div class="card"><div>${q}</div><div class="yn">${["예","아니요"].map(v=>`<button class="chip ${p.screening[k]===v?"on":""}" data-scr="${k}" data-v="${v}">${v}</button>`).join("")}</div></div>`).join("")}`;
    ok=Q.every(([k])=>p.screening[k]);
  } else {
    const prof=finalProfile(p), b=band(prof);
    h=`<h1>준비됐어요</h1>
    <div class="card"><div><b>${b.name}</b> · 만 ${ageOf(prof)}세 · ${prof.sex}</div>
    <div class="mut">${esc(prof.cat)} · ${esc(prof.subName||prof.sub)}${prof.pos?" · "+esc(prof.pos):""}${prof.weightClass?" · "+esc(prof.weightClass):""} · ${LEVELS[prof.level]}</div></div>
    ${b.youth?`<div class="banner info">유소년은 <b>감량·수분 감량 기능이 열리지 않아요.</b> 성장기에는 잘 먹고 잘 쉬는 게 우선이에요.${b.id==="u14"?" 만 14세 미만은 보호자와 함께 써 주세요.":""}</div>`:""}
    ${!b.youth&&prof.cat==="투기"&&prof.level!=="hobby"?`<div class="banner info">투기 종목 대회 출전으로 설정돼서, 나중에 <b>계체 후 회복 계산기</b>가 열려요.</div>`:""}
    ${prof.screeningFlag?`<div class="banner bad">건강 확인에 '예'가 있어요. <b>고강도 운동 전에 진료를 받아 보세요.</b></div>`:""}
    <p class="mut">이 앱은 의학적 진단을 하지 않아요. 기록을 바탕으로 참고할 신호를 보여 줘요.</p>`;
    ok=true;
  }
  $("#app").innerHTML=bar+h+`<button class="btn" id="next" ${ok?"":"disabled"}>${st<N-1?"다음":"시작하기"}</button>${st>0?`<button class="btn ghost" id="prev">이전</button>`:""}`;
  bindOnboard();
}
function finalProfile(p){
  const prof={...p, birthYear:+p.birthYear, birthMonth:+p.birthMonth, height:+p.height, weight:+p.weight, classLimit:p.classLimit?+p.classLimit:null};
  prof.screeningFlag=Object.values(p.screening).includes("예");
  return prof;
}
function bindOnboard(){
  const p=ob.p, re=()=>renderOnboard();
  const on=(sel,fn)=>document.querySelectorAll(sel).forEach(b=>b.onclick=()=>{fn(b);re();});
  const inp=(id,k)=>{ const el=$("#"+id); if(el) el.oninput=()=>{ p[k]=el.value; $("#next").disabled=!okStep(); }; };
  const sel=(id,k)=>{ const el=$("#"+id); if(el) el.onchange=()=>{ p[k]=el.value; re(); }; };
  sel("by","birthYear"); sel("bm","birthMonth");
  on("[data-sex]",b=>p.sex=b.dataset.sex); on("[data-ws]",b=>p.weeklySessions=b.dataset.ws);
  on("[data-lv]",b=>p.level=b.dataset.lv);
  on("[data-cat]",b=>{ if(p.cat!==b.dataset.cat){p.cat=b.dataset.cat;p.sub="";p.pos="";} });
  on("[data-sub]",b=>{ if(p.sub!==b.dataset.sub){p.sub=b.dataset.sub;p.pos="";} });
  on("[data-pos]",b=>p.pos=b.dataset.pos);
  on("[data-scr]",b=>p.screening[b.dataset.scr]=b.dataset.v);
  inp("ht","height"); inp("wt","weight"); inp("wc","weightClass"); inp("wl","classLimit"); inp("subname","subName");
  $("#next").onclick=()=>{ if(ob.step<5){ob.step++;re();window.scrollTo(0,0);} else { S.profile=finalProfile(p); ob=null; save(); go("today"); } };
  const pv=$("#prev"); if(pv) pv.onclick=()=>{ob.step--;re();};
  function okStep(){ return ob.step!==1 || (+p.height>80&&+p.height<250&&+p.weight>20&&+p.weight<250&&p.weeklySessions); }
}

/* ───────── 신호등 (판단 근거를 같이 보여 줌) ───────── */
const wsum = l => (l.sleepQ||0)+(l.fatigue||0)+(l.soreness||0)+(l.stress||0);
const tload = l => (l.trainMin||0)*(l.rpe||0);          // 세션 RPE = 시간(분) × 힘든 정도 (Foster 2001)
function signal(date){
  const p=S.profile, b=band(p), L=S.logs[date]; if(!L||!L.sleepQ) return null;
  const masters = b.id==="masters"||b.id==="m50";
  let lv=0; const why=[]; const up=(n,t)=>{ lv=Math.max(lv,n); why.push([n,t]); };
  // 1) 통증
  if(L.pain===3) up(2,"심한 통증이 있어요.");
  else if(L.pain===2) up(1,"중간 정도 통증이 있어요.");
  // 2) 컨디션 점수: 내 평소(지난 28일)와 비교
  const past=[]; for(let i=1;i<=28;i++){ const x=S.logs[addDays(date,-i)]; if(x&&x.sleepQ) past.push(wsum(x)); }
  const w=wsum(L);
  if(past.length>=7){
    const m=past.reduce((a,c)=>a+c,0)/past.length, sd=Math.max(1,Math.sqrt(past.reduce((a,c)=>a+(c-m)**2,0)/past.length));
    const z=(w-m)/sd, yz=masters?-0.75:-1;
    if(z<=-1.5) up(2,`컨디션 점수(${w}/20)가 평소(${m.toFixed(1)})보다 많이 낮아요.`);
    else if(z<=yz) up(1,`컨디션 점수(${w}/20)가 평소(${m.toFixed(1)})보다 낮아요.`);
  } else {
    if(w<=8) up(2,`컨디션 점수가 매우 낮아요 (${w}/20).`); else if(w<=11) up(1,`컨디션 점수가 낮은 편이에요 (${w}/20).`);
  }
  // 3) 잠
  const need=b.youth?8:7;
  if(L.sleepH && L.sleepH<need-1) up(1,`잠이 ${L.sleepH}시간으로 권장(${b.youth?"8~10":"7"}시간 이상)보다 적어요.`);
  // 4) 훈련량 급증: 최근 7일 합 ÷ 최근 28일 주평균 (참고 지표)
  let acute=0, chronic=0, days=0;
  for(let i=0;i<28;i++){ const x=S.logs[addDays(date,-i)]; if(x){ days++; const v=tload(x); chronic+=v; if(i<7) acute+=v; } }
  if(days>=21 && chronic>0){
    const ratio=acute/(chronic/4), yr=masters?1.2:1.3;
    if(ratio>1.5) up(2,`이번 주 훈련량이 평소의 ${ratio.toFixed(1)}배로 급하게 늘었어요.`);
    else if(ratio>yr) up(1,`이번 주 훈련량이 평소의 ${ratio.toFixed(1)}배로 늘었어요.`);
  }
  // 5) 몸무게 급변 (지난 7일 평균 대비)
  if(L.weight){ const ws=[]; for(let i=1;i<=7;i++){const x=S.logs[addDays(date,-i)]; if(x&&x.weight) ws.push(x.weight);}
    if(ws.length>=3){ const m=ws.reduce((a,c)=>a+c,0)/ws.length, d=(L.weight-m)/m*100;
      if(d<=-2) up(1,`몸무게가 평소보다 ${Math.abs(d).toFixed(1)}% 줄었어요. 덜 먹었거나 물이 부족할 수 있어요.`); } }
  if(!why.length) why.push([0,"평소와 비슷하거나 좋아요."]);
  const msg=["평소대로 훈련해도 좋아요.","강도를 조금 낮추거나 회복(잠·식사·수분)에 신경 써 주세요.","오늘은 가볍게 하거나 쉬어 가세요. 심한 통증이 계속되면 진료를 받아 보세요."][lv];
  return { lv, color:["g","y","r"][lv], name:["초록","노랑","빨강"][lv], msg, why, baseline:past.length };
}

/* ───────── 2차: 식단 + 목표 ─────────
   하루 목표 = 기초대사량(Mifflin-St Jeor) × 활동계수 ± 목표 조정
   단백질·탄수화물은 체중 1kg당 g으로 정하고, 남는 열량을 지방에 배분해요. */
const MEALS=["아침","점심","저녁","간식"], SHARE={아침:.25,점심:.3,저녁:.3,간식:.15};
const AF={"0~1":1.4,"2~3":1.55,"4~5":1.7,"6 이상":1.85};
const r0=x=>Math.round(x), r1=x=>Math.round(x*10)/10;
function curWeight(date=today()){ for(let i=0;i<14;i++){ const L=S.logs[addDays(date,-i)]; if(L&&L.weight) return L.weight; } return S.profile.weight; }
function goalOf(){ return S.goal||{type:"maintain"}; }
function weeksTo(d){ return d? Math.max(0.5,(new Date(d+"T12:00:00")-new Date(today()+"T12:00:00"))/6048e5) : null; }
function plan(g=goalOf(), date=today()){
  const p=S.profile, b=band(p), w=curWeight(date), a=ageOf(p);
  const bmr=10*w+6.25*p.height-5*a+(p.sex==="남성"?5:-161);
  const tdee=bmr*(AF[p.weeklySessions]||1.55);
  const notes=[], warn=[]; let rate=0, adj=0, type=g.type;
  if(type==="lose" && b.youth){ type="maintain"; warn.push("성장기에는 감량 목표를 세우지 않아요. 잘 먹고 잘 쉬는 게 우선이에요. 체중이 걱정되면 보호자와 함께 소아청소년과·스포츠의학 진료를 받아 보세요."); }
  if(type==="lose"){
    const diff=g.targetKg? w-g.targetKg : null, wk=weeksTo(g.date);
    rate = diff&&wk ? diff/wk : w*0.005;              // 기한이 있으면 필요한 속도, 없으면 주 0.5%
    if(diff!==null && diff<=0){ warn.push("목표 체중이 지금보다 무거워요. 증량 목표로 바꿔 주세요."); rate=0; }
    const pct=rate/w*100;
    if(pct>1){ warn.push(`이 기한이면 주 ${r1(rate)}kg(체중의 ${r1(pct)}%)씩 빼야 해요. 근육이 빠지기 쉬운 속도라 주 1%로 맞췄어요. 기한을 늘리거나 목표를 낮춰 주세요.`); rate=w*0.01; }
    else if(pct>0.7) notes.push(`주 ${r1(rate)}kg(체중의 ${r1(pct)}%) 감량. 빠른 편이라 컨디션 신호를 같이 봐 주세요.`);
    else if(rate>0) notes.push(`주 ${r1(rate)}kg(체중의 ${r1(pct)}%) 감량 속도예요.`);
    adj=-Math.min(rate*7700/7, 1000);
  } else if(type==="gain"){
    const diff=g.targetKg? g.targetKg-w : null, wk=weeksTo(g.date);
    rate = diff&&wk ? diff/wk : w*0.0025;
    if(diff!==null && diff<=0){ warn.push("목표 체중이 지금보다 가벼워요. 감량 목표로 바꿔 주세요."); rate=0; }
    const pct=rate/w*100;
    if(pct>0.5){ warn.push(`이 기한이면 주 ${r1(rate)}kg씩 늘려야 해요. 근육보다 지방이 늘기 쉬운 속도라 주 0.5%로 맞췄어요.`); rate=w*0.005; }
    else if(rate>0) notes.push(`주 ${r1(rate)}kg 증량 속도예요.`);
    adj=Math.min(rate*7700/7, 500);
  }
  if(g.targetKg && g.date && rate>0){ notes.push(`${g.date.slice(5).replace("-","/")}까지 ${g.targetKg}kg 목표.`); }
  const floor=Math.max(p.sex==="남성"?1500:1200, bmr);
  let kcal=tdee+adj;
  if(kcal<floor){ warn.push(`계산값이 최소 섭취량보다 낮아서 ${r0(floor)}kcal로 올렸어요. 이보다 덜 먹으면 훈련·회복·호르몬에 문제가 생길 수 있어요.`); kcal=floor; }
  // 탄수화물: 오늘 훈련 시간 기준 (기록 없으면 평소 횟수로 추정)
  const L=S.logs[date]; const avgMin={"0~1":10,"2~3":30,"4~5":55,"6 이상":80}[p.weeklySessions]||30;
  const min = L&&L.trainMin!=null&&L.trainMin!=="" ? +L.trainMin : avgMin;
  let ck = min<30?3 : min<60?5 : min<120?6 : 8;
  const pk = b.youth?1.5 : type==="lose"?2.0 : type==="gain"?1.8 : 1.6;
  const P=pk*w; let C=ck*w; let F=(kcal-4*P-4*C)/9;
  const fmin=0.7*w;
  if(F<fmin){ C=Math.max(3*w,(kcal-4*P-9*fmin)/4); F=Math.max(fmin,(kcal-4*P-4*C)/9); }
  kcal=4*P+4*C+9*F;
  return { kcal:r0(kcal), p:r0(P), c:r0(C), f:r0(F), w, bmr:r0(bmr), tdee:r0(tdee), adj:r0(adj), min, ck:r1(C/w), pk, notes, warn, type, youth:b.youth };
}

const norm=s=>String(s).replace(/[\s_·ㆍ()/]/g,"").toLowerCase();
function searchFoods(q){
  const mine=(S.myFoods||[]).map(f=>[...f,"mine"]);
  const all=[...mine,...(FOODLIST||[])]; const n=norm(q);
  if(!n){ const rec=(S.recent||[]).map(nm=>all.find(f=>f[0]===nm)).filter(Boolean); return rec.slice(0,15); }
  const hit=[]; for(const f of all){ const k=norm(f[0]); const i=k.indexOf(n); if(i<0) continue; hit.push([f, (f[9]==="mine"?-2:0)+(f[1]?-1:0)+(i===0?0:2)+k.length/40]); }

function sum(items){ const t={k:0,c:0,p:0,f:0,na:0}; items.forEach(x=>{t.k+=x.k;t.c+=x.c;t.p+=x.p;t.f+=x.f;t.na+=x.na||0;}); return t; }

function mealVerdict(meal, items, T){
  if(!items.length) return null;
  const t=sum(items), tk=T.kcal*SHARE[meal], tp=T.p*SHARE[meal], out=[];
  const rk=t.k/tk;
  out.push(rk<0.7?["↓",`열량 ${r0(t.k)}kcal, 이 끼니 목표(${r0(tk)})보다 적어요.`]: rk>1.3?["↑",`열량 ${r0(t.k)}kcal, 이 끼니 목표(${r0(tk)})보다 많아요.`]:["✓",`열량 ${r0(t.k)}kcal, 알맞아요.`]);
  if(meal!=="간식"){ out.push(t.p<Math.min(tp*0.7,20)?["↓",`단백질 ${r0(t.p)}g. 한 끼에 20g 이상이 근육 회복에 좋아요.`]:["✓",`단백질 ${r0(t.p)}g.`]); }

}
function nextMealTip(d, T){
  const m=dayMeals(d), eaten=dayTotal(d);
  const order=["아침","점심","저녁"]; const left=order.filter(k=>!m[k].length && order.indexOf(k)>Math.max(-1,...order.map((k2,i)=>m[k2].length?i:-1)));
  if(!left.length) return null;
  const n=left.length, rk=(T.kcal-eaten.k)/n, rp=(T.p-eaten.p)/n, rc=(T.c-eaten.c)/n;
  if(rk<=50) return {meal:left[0], text:"오늘 목표 열량을 이미 채웠어요. 다음 끼니는 채소·국 위주로 가볍게 드세요."};
  const ideas=[];
  if(rp>=25) ideas.push("닭가슴살 100g(단백질 28g)","달걀 2개(13g)","두부 반 모(15g 정도)");
  else if(rp>=12) ideas.push("달걀 2개(단백질 13g)","우유 한 잔(6g)");
  if(rc>=70) ideas.push("밥 한 공기(탄수화물 78g)"); else if(rc>=35) ideas.push("고구마 150g(탄수화물 59g)","바나나 1개(20g)");
  return {meal:left[0], text:`${left[0]}은 약 ${r0(rk)}kcal · 단백질 ${r0(Math.max(0,rp))}g · 탄수화물 ${r0(Math.max(0,rc))}g 정도면 하루 목표에 맞아요.`, ideas};
}
function dayVerdict(d, T){
  const t=dayTotal(d), w=T.w, out=[];
  const rk=t.k/T.kcal;
  out.push(rk<0.85?["↓",`열량 ${r0(t.k)} / ${T.kcal}kcal. ${r0(T.kcal-t.k)}kcal 모자라요.${T.type==="lose"?" 감량 중이어도 너무 적게 먹으면 근육이 빠져요.":" 회복이 늦어질 수 있어요."}`]
          : rk>1.15?["↑",`열량 ${r0(t.k)} / ${T.kcal}kcal. ${r0(t.k-T.kcal)}kcal 많아요.`]:["✓",`열량 ${r0(t.k)} / ${T.kcal}kcal. 알맞아요.`]);
  out.push(t.p<T.p*0.85?["↓",`단백질 ${r0(t.p)} / ${T.p}g (체중 1kg당 ${r1(t.p/w)}g). 내일 아침에 달걀이나 우유를 더해 보세요.`]:["✓",`단백질 ${r0(t.p)} / ${T.p}g (1kg당 ${r1(t.p/w)}g).`]);
  out.push(t.c<T.c*0.8?["↓",`탄수화물 ${r0(t.c)} / ${T.c}g (1kg당 ${r1(t.c/w)}g). 오늘 훈련(${T.min}분)에 비해 적어서 내일 힘이 덜 날 수 있어요.`]:t.c>T.c*1.25?["↑",`탄수화물 ${r0(t.c)} / ${T.c}g. 훈련량에 비해 많은 편이에요.`]:["✓",`탄수화물 ${r0(t.c)} / ${T.c}g (1kg당 ${r1(t.c/w)}g).`]);
  if(t.na>3000) out.push(["!",`나트륨 ${r0(t.na).toLocaleString()}mg. 국물·젓갈·장아찌가 많았는지 보세요. (땀을 많이 흘린 날은 괜찮아요)`]);
  return out;
}

    <div class="grid4">${[["k","열량 kcal"],["c","탄수화물 g"],["p","단백질 g"],["f","지방 g"]].map(([k,l])=>`<div><div class="mut">${l}</div><input type="number" inputmode="decimal" data-ov="${k}" value="${r1(v[k])}"></div>`).join("")}</div>
    ${over?`<p class="mut">직접 고친 숫자를 쓰고 있어요. <a href="#" id="reset">DB 값으로 되돌리기</a></p>`:""}
    <button class="btn" id="psave">${old?"고치기":"추가"}</button><button class="btn ghost" id="cl">취소</button>`);
    $("#pg").onchange=e=>{ g=+e.target.value||0; over=null; draw(); };
    document.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{ g=r0(base.sv*+b.dataset.sv); over=null; draw(); });
    document.querySelectorAll("[data-ov]").forEach(i=>i.onchange=()=>{ over=over||{...calc()}; over[i.dataset.ov]=+i.value||0; draw(); });
    const rs=$("#reset"); if(rs) rs.onclick=e=>{ e.preventDefault(); over=null; draw(); };
    $("#psave").onclick=()=>{ const v=calc(); const item={n:base.n,g,u:base.u,k:v.k,c:v.c,p:v.p,f:v.f,na:base.na*g/100,base,over};
      if(old) m[meal][editIdx]=item; else m[meal].push(item);
      S.recent=[base.n,...(S.recent||[]).filter(x=>x!==base.n)].slice(0,20); save(); closeSheet(); renderFood(); };
    $("#cl").onclick=closeSheet;
  };
  draw();
}
function customSheet(meal,q){
  sheet(`<h2 style="margin-top:0">직접 입력</h2><p class="mut">포장지 영양성분표를 보고 1회 먹은 양 기준으로 적어 주세요. 다음부터 검색에 '내 음식'으로 나와요.</p>
  <label class="f">이름</label><input id="cn" type="text" value="${esc(q||"")}" placeholder="예: 프로틴 쉐이크">
  <div class="row"><div><label class="f">양</label><input id="cg" type="number" inputmode="decimal" value="100"></div><div><label class="f">단위</label><select id="cu"><option>g</option><option>ml</option></select></div></div>
  <div class="grid4">${[["k","열량 kcal"],["c","탄수화물 g"],["p","단백질 g"],["f","지방 g"]].map(([k,l])=>`<div><div class="mut">${l}</div><input type="number" inputmode="decimal" id="c${k}"></div>`).join("")}</div>
  <button class="btn" id="csave">저장하고 추가</button><button class="btn ghost" id="cl">취소</button>`);
  $("#csave").onclick=()=>{ const nm=$("#cn").value.trim(), gg=+$("#cg").value||100, u=$("#cu").value;
    const v=k=>+$("#c"+k).value||0; if(!nm||!v("k")){ toast("이름과 열량은 꼭 적어 주세요."); return; }
    const per=x=>r1(x/gg*100); const f=[nm,0,per(v("k")),per(v("c")),per(v("p")),per(v("f")),0,gg,u==="ml"?1:0];
    S.myFoods=[f,...(S.myFoods||[]).filter(x=>x[0]!==nm)]; save(); portionSheet(meal,f); };
  $("#cl").onclick=closeSheet;
}
function dietCard(){
  const t=dayTotal(), T=plan(), n=MEALS.filter(k=>((S.meals||{})[today()]||{})[k]?.length).length;
  return `<div class="card" data-go="food" style="cursor:pointer"><div class="row" style="align-items:center"><b style="flex:1">오늘 식단</b><span class="mut" style="flex:none">${n?`${n}끼 기록`:"아직 기록 없음"} ›</span></div>
  <div class="mut">${r0(t.k).toLocaleString()} / ${T.kcal.toLocaleString()}kcal · 단백질 ${r0(t.p)} / ${T.p}g</div></div>`;
}

render();
</script>
